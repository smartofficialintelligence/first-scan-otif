[project]
name = "olist-ml"
version = "0.1.0"
description = "Production ML late-delivery risk scoring on Olist (GCP portfolio artifact)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pandas>=2.2.0",
  "numpy>=2.1.0",
  "scikit-learn>=1.5.0",
  "xgboost>=2.1.0",
  "optuna>=4.0.0",
  "shap>=0.46.0",
  "joblib>=1.4.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
  "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "pandas-stubs>=2.2.0",
  "types-PyYAML>=6.0.0",
]
ml = [
  "mlflow>=2.14.0",
]
gcp = [
  "google-cloud-bigquery>=3.25.0",
  "dbt-bigquery>=1.8.0",
  "google-cloud-storage>=2.18.0",
  "feast[gcp]>=0.40.0",
  "google-cloud-aiplatform>=1.60.0",
]
mcp = [
    "mcp>=2.0.0",
]
agent = [
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langsmith>=0.2.0",
]
# Serving-sized Feast: SQLite online store only. The heavy BigQuery offline
# store, dbt, and Vertex SDKs stay in the `gcp` extra (apply/materialize run on
# a workstation, not in the request path).
feast = [
  "feast>=0.40.0",
]
# Makes the DAG objects in airflow/dags/ real (`dag is not None`) for a local
# scheduler. Deliberately not installed in CI or the serving image — Composer
# stays off; the DAG files also run as plain CLIs without this.
airflow = [
  "apache-airflow>=2.9.0",
]

[project.scripts]
olist-train = "olist_ml.training.pipeline:main"
olist-serve = "olist_ml.api.app:run"
olist-mcp = "olist_ml.api.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/olist_ml discovered automatically by hatchling

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "pipelines"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"scripts/**" = ["E501", "E402"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["olist_ml"]
