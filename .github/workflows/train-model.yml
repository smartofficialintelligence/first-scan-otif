name: Train model

# Training is not part of app deploy. Manual / dispatch only — not on every PR.
on:
  workflow_dispatch:
    inputs:
      trials:
        description: Optuna trials (keep small on GHA)
        required: false
        default: "3"

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev --extra ml

      - name: Train fixture pipeline (REGISTERED_CANDIDATE only)
        run: uv run python scripts/run_train_pipeline.py --data-dir data/fixtures --trials ${{ inputs.trials }}

      - name: Confirm no deploy step
        run: |
          echo "train-model.yml stops at REGISTERED_CANDIDATE."
          echo "App deploy is .github/workflows/deploy-api.yml (does not retrain)."
